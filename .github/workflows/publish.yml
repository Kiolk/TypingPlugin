name: Publish Plugin

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and Publish Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Files
        run: |
          echo "${{ secrets.CERTIFICATE_CHAIN }}" > certificateChain.pem
          echo "${{ secrets.PRIVATE_KEY }}" > privateKey.pem
          
          echo "--- Verification ---"
          if [ -f "certificateChain.pem" ]; then
            echo "certificateChain.pem created, size: $(stat -c%s certificateChain.pem) bytes"
          else
            echo "ERROR: certificateChain.pem was not created"
          fi
          
          if [ -f "privateKey.pem" ]; then
            echo "privateKey.pem created, size: $(stat -c%s privateKey.pem) bytes"
            # Check if it starts with the expected header (safely)
            head -n 1 privateKey.pem
          else
            echo "ERROR: privateKey.pem was not created"
          fi

      - name: Build and Publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN_PATH: ${{ github.workspace }}/certificateChain.pem
          PRIVATE_KEY_PATH: ${{ github.workspace }}/privateKey.pem
        run: |
          echo "Checking environment variables..."
          if [ -z "$PRIVATE_KEY_PASSWORD" ]; then echo "PRIVATE_KEY_PASSWORD is empty"; else echo "PRIVATE_KEY_PASSWORD is set"; fi
          ./gradlew publishPlugin
